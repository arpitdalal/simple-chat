# Compile + test on every PR/push (issue #1). macOS binaries only for now.
# No release upload; skip updater signing.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: unit + rust
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - run: npm ci

      - name: Unit / component tests
        run: npm test

      - name: Rust unit tests
        working-directory: src-tauri
        run: cargo test

  build:
    name: tauri build (${{ matrix.label }})
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-aarch64
            args: --target aarch64-apple-darwin
          - label: macos-x86_64
            args: --target x86_64-apple-darwin

    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # createUpdaterArtifacts needs TAURI_SIGNING_PRIVATE_KEY — skip for PR builds.
      # Ad-hoc identity avoids Apple Silicon "damaged" downloads without a Developer ID (#2).
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: "-"
        with:
          args: ${{ matrix.args }} --config ${{ github.workspace }}/.github/tauri.ci.conf.json
