# Real Tauri IPC WebDriver e2e (issue #11). macOS — embedded WebDriver; Linux/Windows Origin IPC broken under automation.
name: WebDriver

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ipc:
    name: tauri-driver IPC (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build release binary
        working-directory: src-tauri
        run: |
          export TAURI_CONFIG="$(cat tauri.webdriver.conf.json)"
          cargo build --release --features webdriver

      - name: WebDriver IPC tests
        run: npm run test:ipc
