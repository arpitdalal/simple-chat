# Real Tauri IPC WebDriver e2e (issue #11). Windows — Linux WebKit custom-protocol Origin breaks IPC.
name: WebDriver

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ipc:
    name: tauri-driver IPC (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build release binary
        run: cargo build --release --features webdriver
        working-directory: src-tauri

      - name: WebDriver IPC tests
        run: npm run test:ipc
