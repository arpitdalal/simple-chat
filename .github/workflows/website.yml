name: Website

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable release tag to deploy (for example, v1.2.3)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Validate website
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.release.outputs.deploy }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Resolve release
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUBLISHED_PRERELEASE: ${{ github.event.release.prerelease }}
          PUBLISHED_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          build=true
          deploy=false
          if [ "$EVENT_NAME" = "release" ]; then
            tag="$PUBLISHED_TAG"
            if [ "$PUBLISHED_PRERELEASE" = "true" ]; then
              build=false
            else
              deploy=true
            fi
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
            deploy=true
          else
            tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          fi
          if [ -z "$tag" ] || [[ "$tag" != v* ]]; then
            echo "::error::A stable release tag beginning with v is required"
            exit 1
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

      - name: Check out source
        if: steps.release.outputs.build == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.deploy == 'true' && steps.release.outputs.tag || github.sha }}

      - name: Verify selected release checkout
        if: steps.release.outputs.deploy == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$RELEASE_TAG")"

      - uses: pnpm/action-setup@v4
        if: steps.release.outputs.build == 'true'
        with:
          version: 12.6.0

      - uses: actions/setup-node@v4
        if: steps.release.outputs.build == 'true'
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.release.outputs.build == 'true'

      - name: Require website source in deployment tag
        if: steps.release.outputs.deploy == 'true'
        run: test -f apps/website/package.json

      - name: Type-check
        if: steps.release.outputs.build == 'true'
        run: pnpm --filter @simple-chat/website check

      - name: Build static site
        if: steps.release.outputs.build == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: pnpm --filter @simple-chat/website build

      - name: Smoke tests
        if: steps.release.outputs.build == 'true'
        run: pnpm --filter @simple-chat/website test

      - name: Package Pages artifact
        if: steps.release.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/website/dist

  deploy:
    name: Deploy to GitHub Pages
    if: needs.build.outputs.deploy == 'true'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
