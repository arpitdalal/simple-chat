[package]
name = "simple-chat"
version = "0.1.0"
description = "Simple Chat — local BYOK AI chat"
authors = ["arpitdalal"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "simple_chat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-sql = { version = "2.4.1", features = ["sqlite"] }
keyring = { version = "4.2.0", features = ["apple-native-keyring-store"] }
chrono = { version = "0.4.45", features = ["serde"] }
tauri-plugin-process = "2"
tauri-plugin-wdio-webdriver = { version = "1.4", optional = true }

[features]
# CI IPC e2e — embeds frontendDist (custom-protocol). Raw `cargo build --release`
# without it keeps cfg(dev) and loads Vite's localhost:1420 → about:blank.
custom-protocol = ["tauri/custom-protocol"]
webdriver = ["dep:tauri-plugin-wdio-webdriver", "custom-protocol"]


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSRunningApplication",
    "NSWorkspace",
    "libc",
] }
